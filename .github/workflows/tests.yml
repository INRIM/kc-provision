name: Tests

on:
  push:
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          # ultima patch 3.14 (>= 3.14.10 per advisory eMudhra/emSign CA), non quella in cache sul runner
          check-latest: true

      - name: Install uv
        run: python -m pip install --upgrade pip uv

      - name: Run tests
        run: uv run --locked python -m pytest tests/
